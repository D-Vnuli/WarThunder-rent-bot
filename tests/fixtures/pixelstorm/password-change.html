<!-- SYNTHETIC CONTRACT FIXTURE: no real Pixel Storm HTML or data. -->
<main data-pixelstorm-page="authenticated" data-pixelstorm-password-state="ready" data-pixelstorm-password-requested="false">
  <label>Current password <input data-pixelstorm-current-password type="password"></label>
  <label>New password <input data-pixelstorm-pending-password type="password"></label>
  <button data-pixelstorm-password-request onclick="this.closest('main').dataset.pixelstormPasswordRequested=this.closest('main').querySelector('[data-pixelstorm-current-password]').value==='synthetic-current'?'true':'false'">Request change</button>
  <button data-pixelstorm-password-submit onclick="const main=this.closest('main');main.dataset.pixelstormPasswordState=(main.querySelector('[data-pixelstorm-current-password]').value==='synthetic-current'&&main.querySelector('[data-pixelstorm-pending-password]').value.length>0)?'changed':'rejected'">Change password</button>
</main>

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "war-thunder-rent-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "google-api-python-client>=2.0,<3",
  "google-auth>=2.0,<3",
  "google-auth-oauthlib>=1.0,<2",
  "playwright>=1.49,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.setuptools]
packages = ["app", "app.adapters", "app.application", "app.config", "app.domain", "app.persistence", "app.templates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
